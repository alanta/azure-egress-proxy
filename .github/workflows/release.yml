name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example: v0.1.0). Leave empty for snapshot build.'
        required: false
        type: string
      snapshot:
        description: 'If true, build artifacts only (no GitHub Release and no image push).'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      push_images: ${{ steps.meta.outputs.push_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: meta
        name: Resolve release metadata
        # Context values are passed through env rather than interpolated into the
        # script body, so nothing from `inputs` can be parsed as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
            publish_release=true
            push_images=true
          else
            input_tag="$INPUT_TAG"
            snapshot="$INPUT_SNAPSHOT"
            if [ -n "$input_tag" ]; then
              case "$input_tag" in
                v*) release_tag="$input_tag" ;;
                *) release_tag="v$input_tag" ;;
              esac
              if [ "$snapshot" = "true" ]; then
                publish_release=false
                push_images=false
              else
                publish_release=true
                push_images=true
              fi
            else
              release_tag="v0.0.0-snapshot.${GITHUB_RUN_NUMBER}"
              publish_release=false
              push_images=false
            fi
          fi

          version="${release_tag#v}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "push_images=$push_images" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod

      - name: Build Linux binaries
        # Asset names carry no version (the release tag does) so the stable
        # `releases/latest/download/...` URLs used by cloud-init and deploy.sh
        # keep working. Each binary gets a `.sha256` sidecar for checksum pinning.
        run: |
          mkdir -p dist
          cd proxy
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "../dist/egress-proxy_linux_${arch}" .
          done
          cd ../dist
          for arch in amd64 arm64; do
            sha256sum "egress-proxy_linux_${arch}" > "egress-proxy_linux_${arch}.sha256"
          done
          sha256sum egress-proxy_linux_amd64 egress-proxy_linux_arm64 > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-binaries-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: |
            dist/egress-proxy_linux_amd64
            dist/egress-proxy_linux_amd64.sha256
            dist/egress-proxy_linux_arm64
            dist/egress-proxy_linux_arm64.sha256
            dist/SHA256SUMS
          generate_release_notes: true

  images:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.push_images == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy image
        if: ${{ hashFiles('proxy/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: proxy
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alanta/azure-egress-proxy/proxy:${{ needs.build.outputs.version }}
            ghcr.io/alanta/azure-egress-proxy/proxy:latest

      - name: Build and push sample-app image
        if: ${{ hashFiles('src/SampleApp/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/SampleApp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alanta/azure-egress-proxy/sample-app:${{ needs.build.outputs.version }}
            ghcr.io/alanta/azure-egress-proxy/sample-app:latest

      - name: Build and push control-plane image
        if: ${{ hashFiles('src/ControlPlane/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/ControlPlane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alanta/azure-egress-proxy/control-plane:${{ needs.build.outputs.version }}
            ghcr.io/alanta/azure-egress-proxy/control-plane:latest

      - name: Build and push portal image
        if: ${{ hashFiles('src/Portal/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src/Portal/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alanta/azure-egress-proxy/portal:${{ needs.build.outputs.version }}
            ghcr.io/alanta/azure-egress-proxy/portal:latest
