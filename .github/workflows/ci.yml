name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly stdlib-vuln sweep: Dependabot cannot bump the `go` directive in go.mod
    # (dependabot-core#13520), and release.yml now floats to the newest 1.25.x patch
    # rather than pinning go.mod exactly, so this is the gate that actually catches a
    # reachable stdlib CVE between manual bumps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # The weekly schedule run exists only to drive govulncheck; the path filter has no base
    # to diff against on that trigger, so skip it and let every path-gated job fall through.
    if: github.event_name != 'schedule'
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      infra: ${{ steps.filter.outputs.infra }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      workflows: ${{ steps.filter.outputs.workflows }}
      mock_idp: ${{ steps.filter.outputs.mock_idp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            proxy:
              - 'proxy/**'
            dotnet:
              - 'AzureEgressProxy.slnx'
              - 'src/**'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'NuGet.config'
            infra:
              - 'infra/**'
            scripts:
              - 'scripts/**/*.sh'
            # A change to this file can change any job, so it runs them all.
            workflow:
              - '.github/workflows/ci.yml'
            # Any workflow, including release/deploy/allowlist: linted, never run here.
            workflows:
              - '.github/workflows/**'
            mock_idp:
              - 'mock-idp/**'

  proxy:
    name: Build proxy image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The same builder setup, action pins and platforms as release.yml, so a change that
      # would break the release image build fails here first, and a bump of these actions is
      # exercised before it reaches a release.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build proxy image (amd64 and arm64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  app-images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: changes
    # release.yml publishes these three images; until this job, CI never built them, so a
    # base-image bump or a Dockerfile change could pass CI and fail the release.
    if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sample-app
            dockerfile: src/SampleApp/Dockerfile
          - image: control-plane
            dockerfile: src/ControlPlane/Dockerfile
          - image: portal
            dockerfile: src/Portal/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same setup as the proxy job above: mirrors release.yml.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image (amd64 and arm64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false

  mock-idp:
    name: Build and smoke-test mock IdP image
    runs-on: ubuntu-latest
    needs: changes
    # Local-dev only and never released, but its base image and the inline PyJWT pin still
    # move, and nothing else would notice them breaking.
    if: needs.changes.outputs.mock_idp == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and start the mock IdP
        run: |
          docker build -t mock-idp:ci mock-idp/
          docker run -d --name mock-idp -p 127.0.0.1:8080:8080 mock-idp:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/jwks >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::The mock IdP did not serve /jwks within 30 seconds."
          exit 1
      - name: Issue a token and verify it against the JWKS
        # Signing and verification both run inside the image, so this exercises the
        # Python base image together with PyJWT[crypto], the way the local stack uses them.
        run: |
          token=$(curl -fsS 'http://127.0.0.1:8080/token?appid=ci-smoke')
          docker exec -i -e TOKEN="$token" mock-idp python - <<'PY'
          import json, os, urllib.request
          import jwt
          from jwt.algorithms import RSAAlgorithm
          keys = json.load(urllib.request.urlopen("http://127.0.0.1:8080/jwks"))["keys"]
          key = RSAAlgorithm.from_jwk(json.dumps(keys[0]))
          claims = jwt.decode(os.environ["TOKEN"], key, algorithms=["RS256"], audience="egress-proxy")
          assert claims["appid"] == "ci-smoke", claims
          print("token verified for appid", claims["appid"])
          PY
      - name: Show mock IdP logs
        if: failure()
        run: docker logs mock-idp || true

  go-toolchain:
    name: Check Go toolchain consistency
    runs-on: ubuntu-latest
    needs: changes
    # The Go line is declared in go.mod, the proxy Dockerfile and every setup-go step.
    # Dependabot bumps the Dockerfile tag on its own (and cannot bump go.mod at all), so
    # a PR could ship the container on one Go line while govulncheck and the release
    # binaries use another. This fails that PR instead of letting the lines drift apart.
    if: needs.changes.outputs.proxy == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare Go versions across go.mod, Dockerfiles and workflows
        run: |
          python3 - <<'PY'
          import glob, re, sys
          version = r"(\d+)\.(\d+)(?:\.\d+)?"
          sources = [
              (["proxy/go.mod"], rf"^(?:go|toolchain go)\s*{version}\s*$"),
              (glob.glob("**/Dockerfile*", recursive=True), rf"golang:{version}"),
              (glob.glob(".github/workflows/*.y*ml"), rf"go-version:\s*['\"]?{version}"),
          ]
          found = []
          for paths, pattern in sources:
              for path in sorted(paths):
                  for number, line in enumerate(open(path, encoding="utf-8"), 1):
                      for m in re.finditer(pattern, line.strip()):
                          found.append((path, number, f"{m.group(1)}.{m.group(2)}"))
          if not any(path == "proxy/go.mod" for path, _, _ in found):
              print("::error file=proxy/go.mod::No go directive found.")
              sys.exit(1)
          lines = sorted({v for _, _, v in found})
          for path, number, v in found:
              print(f"{path}:{number}: Go {v}")
          if len(lines) > 1:
              for path, number, v in found:
                  print(f"::error file={path},line={number}::Go {v} here; the repository "
                        f"declares {', '.join(lines)}. Move every declaration together.")
              sys.exit(1)
          print(f"All {len(found)} declarations are on Go {lines[0]}.")
          PY

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    needs: changes
    # deploy.yml, release.yml and allowlist.yml can't run on a PR (they need Azure, tags or
    # GHCR writes), so a change to them, including an action bump, is otherwise unchecked.
    # actionlint catches syntax, expression and input errors, and runs shellcheck over
    # every run: body.
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25'
          check-latest: true
      - name: Install actionlint
        # Pinned explicitly (never @latest), like govulncheck; the Go checksum database makes
        # the version immutable. Dependabot does not track this pin: bump it by hand.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        env:
          GOTOOLCHAIN: local
      - name: Run actionlint
        # shellcheck is preinstalled on ubuntu-latest, so actionlint picks it up.
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  govulncheck:
    name: Scan proxy module for reachable vulnerabilities
    runs-on: ubuntu-latest
    needs: changes
    if: always() && (github.event_name == 'schedule' || needs.changes.outputs.proxy == 'true' || needs.changes.outputs.workflow == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        # Same version policy as release.yml: the 1.25 line, always its newest patch, so
        # this job actually catches what a release build would ship.
        with:
          go-version: '1.25'
          check-latest: true
      - name: Install govulncheck
        # v1.7.0 pinned explicitly (never @latest): golang.org/x/vuln v1.8.0 needs go >=1.26
        # to install and would fail this job outright while the proxy stays on the 1.25 line.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        env:
          GOTOOLCHAIN: local
      - name: Run govulncheck
        working-directory: proxy
        run: govulncheck ./...

  dotnet:
    name: Build and test .NET solution
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          if [ ! -f AzureEgressProxy.slnx ]; then
            echo "::notice::AzureEgressProxy.slnx not present yet; skipping .NET build/test."
            exit 0
          fi
          # --locked-mode fails the build if resolved packages drift from the committed
          # packages.lock.json rather than silently restoring something else.
          dotnet restore AzureEgressProxy.slnx --locked-mode
          dotnet build AzureEgressProxy.slnx --configuration Release --no-restore
          dotnet test AzureEgressProxy.slnx --configuration Release --no-build

  bicep:
    name: Validate Bicep files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Bicep templates
        run: |
          if [ ! -d infra ]; then
            echo "::notice::infra/ not present yet; skipping Bicep validation."
            exit 0
          fi
          if ! command -v az >/dev/null 2>&1; then
            echo "::error::Azure CLI is required for az bicep build."
            exit 1
          fi
          mapfile -t bicep_files < <(find infra -type f -name '*.bicep' | sort)
          if [ "${#bicep_files[@]}" -eq 0 ]; then
            echo "::notice::No .bicep files found under infra/."
            exit 0
          fi
          for file in "${bicep_files[@]}"; do
            az bicep build --file "$file"
          done

      - name: Check NSG rule description lengths
        # ARM rejects a security rule description over 140 characters, and `az bicep build` does
        # NOT catch it — it is preflight validation, not compilation. Without this check the
        # failure surfaces twenty minutes into a deployment, after the resource groups, the
        # registry and the scale set have already been created. Cheap here, expensive there.
        run: |
          if [ ! -d infra ]; then exit 0; fi
          python3 - <<'PY'
          import glob, re, sys
          limit, bad = 140, 0
          for path in sorted(glob.glob('infra/**/*.bicep', recursive=True)):
              src = open(path, encoding='utf-8').read()
              for m in re.finditer(r"description:\s*'((?:[^'\\]|\\.)*)'", src):
                  value = m.group(1).replace("\\'", "'")
                  if len(value) > limit:
                      line = src[:m.start()].count('\n') + 1
                      print(f"::error file={path},line={line}::NSG rule description is "
                            f"{len(value)} chars, limit is {limit}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

  shell:
    name: Shell script lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shellcheck on scripts
        run: |
          if [ ! -d scripts ]; then
            echo "::notice::scripts/ not present yet; skipping shellcheck."
            exit 0
          fi
          mapfile -t script_files < <(find scripts -maxdepth 1 -type f -name '*.sh' | sort)
          if [ "${#script_files[@]}" -eq 0 ]; then
            echo "::notice::No shell scripts found under scripts/."
            exit 0
          fi
          shellcheck "${script_files[@]}"

  result:
    name: CI result
    runs-on: ubuntu-latest
    # One status to require on main. The path-gated jobs above report "skipped" when they
    # don't apply, and a skipped required check counts as passing; this job passes only when
    # every job either succeeded or was skipped by its own condition, and fails on a failed
    # or cancelled one (a cancelled `changes` job skips everything after it).
    needs: [changes, proxy, app-images, mock-idp, go-toolchain, govulncheck, dotnet, bicep, shell, actionlint]
    if: always()
    steps:
      - name: Check every job's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: v["result"] for job, v in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          bad = sorted(job for job, result in results.items() if result not in ("success", "skipped"))
          if bad:
              print(f"::error::Not successful: {', '.join(bad)}")
              sys.exit(1)
          PY
