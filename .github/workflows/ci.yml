name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      infra: ${{ steps.filter.outputs.infra }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            proxy:
              - 'proxy/**'
            dotnet:
              - 'AzureEgressProxy.slnx'
              - 'src/**'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'NuGet.config'
            infra:
              - 'infra/**'
            scripts:
              - 'scripts/**/*.sh'
            workflow:
              - '.github/workflows/ci.yml'

  proxy:
    name: Build proxy image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build proxy Docker image
        run: |
          if [ ! -d proxy ]; then
            echo "::notice::proxy/ not present yet; skipping."
            exit 0
          fi
          docker build proxy/

  dotnet:
    name: Build and test .NET solution
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          if [ ! -f AzureEgressProxy.slnx ]; then
            echo "::notice::AzureEgressProxy.slnx not present yet; skipping .NET build/test."
            exit 0
          fi
          # --locked-mode fails the build if resolved packages drift from the committed
          # packages.lock.json rather than silently restoring something else.
          dotnet restore AzureEgressProxy.slnx --locked-mode
          dotnet build AzureEgressProxy.slnx --configuration Release --no-restore
          dotnet test AzureEgressProxy.slnx --configuration Release --no-build

  bicep:
    name: Validate Bicep files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Bicep templates
        run: |
          if [ ! -d infra ]; then
            echo "::notice::infra/ not present yet; skipping Bicep validation."
            exit 0
          fi
          if ! command -v az >/dev/null 2>&1; then
            echo "::error::Azure CLI is required for az bicep build."
            exit 1
          fi
          mapfile -t bicep_files < <(find infra -type f -name '*.bicep' | sort)
          if [ "${#bicep_files[@]}" -eq 0 ]; then
            echo "::notice::No .bicep files found under infra/."
            exit 0
          fi
          for file in "${bicep_files[@]}"; do
            az bicep build --file "$file"
          done

      - name: Check NSG rule description lengths
        # ARM rejects a security rule description over 140 characters, and `az bicep build` does
        # NOT catch it — it is preflight validation, not compilation. Without this check the
        # failure surfaces twenty minutes into a deployment, after the resource groups, the
        # registry and the scale set have already been created. Cheap here, expensive there.
        run: |
          if [ ! -d infra ]; then exit 0; fi
          python3 - <<'PY'
          import glob, re, sys
          limit, bad = 140, 0
          for path in sorted(glob.glob('infra/**/*.bicep', recursive=True)):
              src = open(path, encoding='utf-8').read()
              for m in re.finditer(r"description:\s*'((?:[^'\\]|\\.)*)'", src):
                  value = m.group(1).replace("\\'", "'")
                  if len(value) > limit:
                      line = src[:m.start()].count('\n') + 1
                      print(f"::error file={path},line={line}::NSG rule description is "
                            f"{len(value)} chars, limit is {limit}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

  shell:
    name: Shell script lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run shellcheck on scripts
        run: |
          if [ ! -d scripts ]; then
            echo "::notice::scripts/ not present yet; skipping shellcheck."
            exit 0
          fi
          mapfile -t script_files < <(find scripts -maxdepth 1 -type f -name '*.sh' | sort)
          if [ "${#script_files[@]}" -eq 0 ]; then
            echo "::notice::No shell scripts found under scripts/."
            exit 0
          fi
          shellcheck "${script_files[@]}"
