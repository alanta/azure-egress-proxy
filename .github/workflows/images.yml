name: Images

# The one definition of how the released container images are built. ci.yml calls it with
# push: false, release.yml with push: true, so a change to this file (a builder action, a
# platform, a build input) is built by CI exactly as a release would build it. Only the
# GHCR login and the push itself run in release alone.
#
# No `permissions:` block here, deliberately: a called workflow can only narrow the token
# its caller grants, and declaring `packages: write` would make the read-only CI caller
# fail. Each calling job declares the permissions it grants (SECURITY_GUIDELINES.md § 1.3).
on:
  workflow_call:
    inputs:
      push:
        description: Push the images to GHCR. Only release.yml sets this.
        type: boolean
        required: true
      version:
        description: Image tag to push, for example 0.5.0. Required when push is true.
        type: string
        default: ''
      images:
        description: JSON list of images to build.
        type: string
        default: '["proxy", "sample-app", "control-plane", "portal"]'

env:
  # Image name -> Dockerfile. The proxy builds from its own directory; the .NET apps
  # build from the repository root, where Central Package Management lives.
  DOCKERFILES: '{"proxy": "proxy/Dockerfile", "sample-app": "src/SampleApp/Dockerfile", "control-plane": "src/ControlPlane/Dockerfile", "portal": "src/Portal/Dockerfile"}'

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Check inputs
        env:
          PUSH: ${{ inputs.push }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$PUSH" = "true" ] && [ -z "$VERSION" ]; then
            echo "::error::push is true but no version was given."
            exit 1
          fi
          if ! jq -e --arg i "$IMAGE" 'has($i)' <<<"$DOCKERFILES" >/dev/null; then
            echo "::error::Unknown image '$IMAGE'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ inputs.push && 'and push ' || '' }}image (amd64 and arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image == 'proxy' && 'proxy' || '.' }}
          file: ${{ fromJSON(env.DOCKERFILES)[matrix.image] }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ inputs.push && format('ghcr.io/alanta/azure-egress-proxy/{0}:{1},ghcr.io/alanta/azure-egress-proxy/{0}:latest', matrix.image, inputs.version) || '' }}
